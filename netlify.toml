[build]
  # Install Hugo when the build environment doesn't provide it (e.g. CLI-driven builds)
  command = """
    if ! command -v hugo >/dev/null 2>&1; then
      mkdir -p /tmp/hugo-bin &&
      curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /tmp/hugo-bin hugo &&
      export PATH="/tmp/hugo-bin:$PATH";
    fi &&
    hugo --gc --minify
  """
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.167.0"
